name: CI
# Roda em TODA branch, não só na main. Isto não é preferência: a proteção da `main` exige os
# checks `frontend` e `backend-lint`, e um push direto só pode satisfazê-los se eles já tiverem
# rodado NAQUELE commit antes. Enquanto o CI só rodava na main, a proteção era impossível de
# satisfazer por push direto e todo push saía com "Bypassed rule violations".
#
# Fluxo que isto habilita (sem exigir PR): push na branch → CI verde no SHA →
# fast-forward da main com o MESMO SHA → o push passa porque os checks já estão verdes.
on:
  push:
    branches: ['**']
  pull_request:

# Push rápido em sequência cancela o run anterior da mesma ref — economiza minuto de Actions.
# Nunca cancela o run de um SHA que já virou tip da main (aquele já terminou).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  backend-lint:
    runs-on: ubuntu-latest
    # Bloqueante: baseline do deno lint zerada na Onda 5 (plans/009). Mantenha em 0.
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint --config supabase/functions/deno.json
      # Bloqueante: deno check zerado (plans/020). Mantenha em 0.
      - run: deno check --config supabase/functions/deno.json $(git ls-files 'supabase/functions/**/*.ts' | grep -v __tests__)
