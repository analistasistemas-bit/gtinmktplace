name: CI
# Roda em TODA branch, não só na main. Isto não é preferência: a proteção da `main` exige os
# checks `frontend` e `backend-lint`, e um push direto só pode satisfazê-los se eles já tiverem
# rodado NAQUELE commit antes. Enquanto o CI só rodava na main, a proteção era impossível de
# satisfazer por push direto e todo push saía com "Bypassed rule violations".
#
# Fluxo que isto habilita (sem exigir PR): push na branch → CI verde no SHA →
# fast-forward da main com o MESMO SHA → o push passa porque os checks já estão verdes.
on:
  push:
    branches: ['**']
  pull_request:

# Push rápido em sequência cancela o run anterior da mesma ref — economiza minuto de Actions.
# Nunca cancela o run de um SHA que já virou tip da main (aquele já terminou).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# O job `frontend` levava ~4 min e 80% disso era `pnpm test` (3m11 de 3m58, medido no run
# 31980783835). A suíte roda em 3 shards paralelos — `vitest --shard` divide por ARQUIVO, então
# a soma cobre exatamente a suíte inteira (verificado: 1036 + 1061 + 1183 = 3280, idêntico ao
# `vitest run` completo). Nada de "só os testes afetados": a cobertura continua total, muda só o
# wall-clock.
#
# `frontend` continua existindo como job — é o nome exato que a proteção da `main` exige — mas
# virou GATE: não roda nada, só reprova se qualquer paralelo abaixo falhar. Renomear ou remover
# este job quebra o merge por push direto.
jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  test:
    runs-on: ubuntu-latest
    strategy:
      # Sem fail-fast: um shard vermelho não deve esconder o resultado dos outros dois — com 3
      # relatórios de uma vez, um push conserta tudo.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --shard=${{ matrix.shard }}/3

  frontend:
    needs: [lint-build, test]
    # `always()` é obrigatório: sem ele o gate fica `skipped` quando um dependente falha, e check
    # pulado não é check verde — a proteção da `main` ficaria travada sem dizer por quê.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Reprovar se lint/build ou algum shard falhou
        run: |
          echo "lint-build: ${{ needs.lint-build.result }}"
          echo "test:       ${{ needs.test.result }}"
          [ "${{ needs.lint-build.result }}" = "success" ] || exit 1
          [ "${{ needs.test.result }}" = "success" ] || exit 1

  backend-lint:
    runs-on: ubuntu-latest
    # Bloqueante: baseline do deno lint zerada na Onda 5 (plans/009). Mantenha em 0.
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint --config supabase/functions/deno.json
      # Bloqueante: deno check zerado (plans/020). Mantenha em 0.
      - run: deno check --config supabase/functions/deno.json $(git ls-files 'supabase/functions/**/*.ts' | grep -v __tests__)
