services:
  - type: web
    name: ean2marketplace-frontend
    runtime: static
    rootDir: .
    buildCommand: pnpm install && pnpm build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Gateway de mercado (ADR-0132 D-2, D-14): Web Service separado, único cliente MCP/OAuth da
  # JoomPulse. Deploy independente do frontend estático acima — é o ponto da D-14.
  #
  # `rootDir: .` de propósito: o gateway usa o tsconfig, o eslint e o vitest da raiz, e é por isso
  # que ele entra nos checks que a proteção da main exige. Pacote pnpm separado ficaria sem CI
  # nenhum — inaceitável no serviço que guarda credencial de todas as organizações.
  - type: web
    name: publiai-gateway-mercado
    runtime: node
    rootDir: .
    # `free` porque `starter` exige dados de pagamento na conta — o
    # `render blueprints validate` reprova com `need_payment_info`. O serviço foi criado assim em
    # 2026-08-29 para destravar o teste do CIMD.
    #
    # ATENÇÃO para produção: no plano free o serviço HIBERNA após ~15 min sem tráfego, e o próximo
    # pedido paga um cold start de dezenas de segundos. Como o Radar chama o Gateway ao ABRIR a
    # tela (D-4), isso é inaceitável para o operador — a D-14 já mandava medir cold start. Trocar
    # para `starter` é mudar esta linha, depois de haver forma de pagamento na conta.
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm gateway:build
    startCommand: pnpm gateway:start
    healthCheckPath: /health
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false
      # Service role: o Gateway verifica o token e lê profiles/organizations de forma independente
      # do que o browser afirma (D-4, D-15). Nunca sai do serviço, nunca vai a log.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Allowlist de origens do browser, separadas por vírgula. Sem curinga: a D-2 põe o browser
      # chamando o Gateway direto, então CORS aqui é superfície de segurança.
      - key: ORIGENS_PERMITIDAS
        sync: false
      # Chave AES-256-GCM em base64 (32 bytes) das credenciais JoomPulse. Vive só aqui: o banco
      # guarda o ciphertext e nunca vê a chave, então um dump do Postgres não dá acesso à
      # JoomPulse. Gerar com: openssl rand -base64 32
      - key: CREDENCIAL_CHAVE_BASE64
        sync: false
      # Duas formas válidas:
      #  (a) identificador opaco, se a JoomPulse emitir um;
      #  (b) modo CIMD — a URL pública DESTE serviço em /v1/client-metadata.json. O provedor
      #      declara client_id_metadata_document_supported: true e não tem registration_endpoint,
      #      então o Gateway publica o próprio documento e dispensa registro prévio.
      #      Ex.: https://publiai-gateway-mercado.onrender.com/v1/client-metadata.json
      #      O boot recusa uma URL https que não termine nesse caminho.
      - key: JOOMPULSE_CLIENT_ID
        sync: false
      # Opcional: vira `client_uri` no documento do cliente, para a tela de consentimento.
      - key: APP_URL
        sync: false
      # Opcional: sem ele o Gateway atua como client público, e o PKCE (S256) segue protegendo o
      # code — `none` está em token_endpoint_auth_methods_supported do provedor.
      - key: JOOMPULSE_CLIENT_SECRET
        sync: false
      # Precisa bater EXATAMENTE com o redirect_uri registrado na JoomPulse.
      - key: GATEWAY_REDIRECT_URI
        sync: false
      # Para onde devolver o browser depois do callback (tela de Canais do app).
      - key: APP_URL_CANAIS
        sync: false
