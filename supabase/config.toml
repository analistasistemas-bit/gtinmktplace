# Config versionada das Edge Functions. Fonte da verdade do verify_jwt por função
# (congelado do estado de produção em 2026-06-26). NÃO normalizar valores: espelha
# exatamente o que está deployado e funcionando. Ver plans/004 e ADR-0037.
project_id = "txvncrgkoynoxwopfkbp"

# --- verify_jwt = false (públicas / QStash / callbacks ML) ---
[functions.hello]
verify_jwt = false
[functions.process-familia]
verify_jwt = false
[functions.regenerar-copy-familia]
verify_jwt = false
[functions.ml-oauth-disconnect]
verify_jwt = false
[functions.ml-oauth-start]
verify_jwt = false
[functions.ml-oauth-callback]
verify_jwt = false
# ADR-0091: acompanha as irmãs de OAuth — a checagem real (requireUserOrg + admin) é dentro da
# function, e é ela que define em qual org a conexão é gravada.
[functions.ml-oauth-claim]
verify_jwt = false
[functions.publish-familia-ml]
verify_jwt = false
[functions.calcular-tarifa-ml]
verify_jwt = false
[functions.update-familia-ml]
verify_jwt = false
[functions.publicar-split-ml]
verify_jwt = false
[functions.remover-publicado]
verify_jwt = false
[functions.vincular-catalogo]
verify_jwt = false
[functions.publicar-anuncio]
verify_jwt = false
[functions.sincronizar-estoque]
verify_jwt = false
[functions.reconciliar-estoque]
verify_jwt = false
# E6b: chamadas pelo APP com o JWT do usuário (não pelo QStash) — verify_jwt fica ligado.
# Explícito de propósito, para a intenção ficar registrada ao lado dos workers.
[functions.cadastrar-produto]
verify_jwt = true
[functions.entrada-estoque]
verify_jwt = true
# ADR-0110: ajuste/zeragem de saldo. Chamada pelo APP com o JWT do admin.
[functions.ajustar-estoque]
verify_jwt = true
# ADR-0113: exclusão de produto não publicado. Chamada pelo APP com o JWT do admin.
[functions.excluir-produto]
verify_jwt = true
[functions.reprocessar-familia]
verify_jwt = false
[functions.retentar-catalogo]
verify_jwt = false
[functions.monitorar-moderados]
verify_jwt = false
[functions.sync-pergunta]
verify_jwt = false
[functions.sync-mensagem]
verify_jwt = false
[functions.sync-devolucao]
verify_jwt = false
[functions.notificar-liberacao]
verify_jwt = false
# ADR-0119 (Pulse): dual-mode como monitorar-moderados — QStash (cron) chama sem JWT; a
# checagem real (assinatura ou requireUserOrg) é dentro da function.
[functions.pulse-coletar]
verify_jwt = false

# --- verify_jwt = true (chamadas com JWT: frontend ou QStash autenticado) ---
[functions.atributos-familia]
verify_jwt = true
