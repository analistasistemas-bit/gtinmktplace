<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PubliAI</title>
    <style>
      :root { color-scheme: light; --tinta: #111827; --suave: #4b5563; --borda: #d1d5db; --marca: #0f766e; --erro: #b91c1c; }
      body { margin: 0; padding: 12px; font: 14px/1.45 system-ui, sans-serif; color: var(--tinta); background: #fff; }
      h1 { font-size: 15px; margin: 0 0 12px; color: var(--marca); }
      h2 { font-size: 15px; margin: 0 0 8px; }
      h3 { font-size: 14px; margin: 0 0 6px; }
      p { margin: 6px 0; }
      .bloco { margin-bottom: 14px; }
      .campo { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; font-weight: 600; }
      input[type='number'], input[type='search'] { font: inherit; padding: 6px 8px; border: 1px solid var(--borda); border-radius: 6px; }
      .origem { border: 1px solid var(--borda); border-radius: 6px; margin: 8px 0; padding: 6px 10px; display: flex; gap: 14px; }
      .origem legend { font-weight: 600; padding: 0 4px; }
      .tipos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
      .tipo { border: 1px solid var(--borda); border-radius: 8px; padding: 8px; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin: 0; }
      dt { color: var(--suave); }
      dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
      .nota { color: var(--suave); font-size: 12px; }
      .aviso { color: #92400e; }
      .erro { color: var(--erro); }
      .avisos { margin: 6px 0 0; padding-left: 16px; font-size: 12px; color: var(--suave); }
      button, .botao { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--marca); background: var(--marca); color: #fff; cursor: pointer; text-decoration: none; display: inline-block; }
      button.secundario { background: #fff; color: var(--marca); }
      button:disabled { opacity: 0.6; cursor: default; }
      .busca { display: flex; gap: 6px; align-items: flex-end; }
      .busca .campo { flex: 1; }
      .resultados { list-style: none; padding: 0; margin: 6px 0; display: flex; flex-direction: column; gap: 4px; }
      .resultados button { width: 100%; text-align: left; background: #fff; color: var(--tinta); border-color: var(--borda); }
    </style>
  </head>
  <body>
    <h1>PubliAI</h1>
    <div id="raiz"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
